spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Splitfy}
spring.config.import=optional:classpath:application-local.properties
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Defina SPLITFY_JWT_SECRET no ambiente com ao menos 32 bytes aleatorios.
splitfy.jwt.secret=${SPLITFY_JWT_SECRET}
splitfy.jwt.expiracao-segundos=3600

# During local development, always serve the current frontend assets.
spring.web.resources.cache.cachecontrol.no-store=true

