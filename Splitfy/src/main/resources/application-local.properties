# Perfil "local": roda a aplicacao (ex.: no IntelliJ) sem precisar do Postgres.
# Ative com -Dspring.profiles.active=local (a configuracao "Splitfy (local)" do IntelliJ ja faz isso).

# Banco H2 em memoria: as tabelas sao criadas pelo Hibernate a partir das entidades e apagadas ao parar a aplicacao.
spring.datasource.url=jdbc:h2:mem:splitfy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# As migrations sao escritas para o Postgres; no H2 o schema vem das entidades.
spring.flyway.enabled=false
