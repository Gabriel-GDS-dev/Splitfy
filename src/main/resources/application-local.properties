# Perfil "local": roda a aplicacao (ex.: no IntelliJ) sem Postgres e sem o modulo de seguranca com JWT.
# Ative com -Dspring.profiles.active=local (a configuracao ".run/Splitfy (local)" do IntelliJ ja faz isso).

# Banco H2 em memoria: as tabelas sao criadas pelo Hibernate a partir das entidades e apagadas ao parar a aplicacao.
spring.datasource.url=jdbc:h2:mem:splitfy;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Usuario fixo do Basic Auth usado pela CatalogSecurityConfig.
spring.security.user.name=user
spring.security.user.password=splitfy
